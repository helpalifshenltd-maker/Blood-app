name: Build APK & AAB

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: Restore Clean Gradle Wrapper JAR
      run: |
        mkdir -p gradle/wrapper
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v9.3.1/gradle/wrapper/gradle-wrapper.jar

    - name: Ensure google-services.json exists
      run: |
        if [ ! -f "app/google-services.json" ]; then
          mkdir -p app
          cat << 'EOF' > app/google-services.json
        {
          "project_info": {
            "project_number": "1032126723993",
            "firebase_url": "https://alif-blood-bank-default-rtdb.firebaseio.com",
            "project_id": "alif-blood-bank",
            "storage_bucket": "alif-blood-bank.firebasestorage.app"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:1032126723993:android:8a06781dd85fc3c5674508",
                "android_client_info": {
                  "package_name": "my.alifbooldbank.com"
                }
              },
              "oauth_client": [],
              "api_key": [
                {
                  "current_key": "AIzaSyBfauc5IDT7_9OxXUHAkJJhflAdZjlck0g"
                }
              ],
              "services": {}
            }
          ],
          "configuration_version": "1"
        }
        EOF
          echo "Created default google-services.json for GitHub build."
        fi

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Build Release App Bundle (AAB)
      run: ./gradlew bundleRelease

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/*.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: app/build/outputs/apk/release/*.apk

    - name: Upload Release AAB
      uses: actions/upload-artifact@v4
      with:
        name: release-aab
        path: app/build/outputs/bundle/release/*.aab

    - name: Prepare GitHub Pages Landing Site
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      run: |
        mkdir -p site
        cp app/build/outputs/apk/release/*.apk site/app-release.apk
        cp app/build/outputs/apk/debug/*.apk site/app-debug.apk
        cat << 'EOF' > site/index.html
        <!DOCTYPE html>
        <html lang="bn">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Download Blood Bank App</title>
          <style>
            body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #f4f6f9; padding: 40px 20px; color: #333; }
            .card { background: #ffffff; max-width: 480px; margin: 0 auto; padding: 32px 24px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
            .icon { font-size: 54px; margin-bottom: 10px; }
            h1 { color: #c62828; margin: 0 0 10px 0; font-size: 26px; }
            p { color: #555; font-size: 15px; line-height: 1.5; margin-bottom: 24px; }
            .btn { display: block; background: #c62828; color: #ffffff; text-decoration: none; padding: 14px 20px; border-radius: 12px; font-weight: bold; font-size: 16px; margin: 12px 0; transition: background 0.2s ease; }
            .btn:hover { background: #b71c1c; }
            .btn-sec { background: #37474f; }
            .btn-sec:hover { background: #263238; }
            .note { font-size: 12px; color: #888; margin-top: 20px; }
          </style>
        </head>
        <body>
          <div class="card">
            <div class="icon">🩸</div>
            <h1>Blood Bank App</h1>
            <p>অ্যাপটি আপনার ফোনে ডাউনলোড ও ইনস্টল করতে নিচের বাটনে ক্লিক করুন:</p>
            <a class="btn" href="app-release.apk" download>📥 Download Release APK</a>
            <a class="btn btn-sec" href="app-debug.apk" download>📥 Download Debug APK</a>
            <p class="note">Version: Latest Auto-Build from GitHub Actions</p>
          </div>
        </body>
        </html>
        EOF

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./site

